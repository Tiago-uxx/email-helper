<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Helper</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>📩 Email Helper</h1>
    <p class="subtitle">
        Generatore di risposte per Minor Hotels
    </p>

    <div class="card">

        <label>Email ricevuta</label>

        <textarea
            id="emailInput"
            placeholder="Incolla qui l'email del cliente..."
        ></textarea>
        <br><br>

<button onclick="analizzaEmail()">
    Analizza Email
</button>

    </div>

    <div class="card">

        <label>Tipo Cliente</label>

        <div class="buttons">

            <button id="privato">
                👤 Privato
            </button>

            <button id="azienda">
                🏢 Azienda
            </button>

            <button id="agenzia">
                ✈️ Agenzia
            </button>

        </div>

    </div>

    <div class="card">

        <label>Hotel</label>
        <input type="text" id="hotel">
        <label>Cliente</label>
<input type="text" id="cliente">

        <label>Check-in</label>
        <input type="text" id="checkin">

        <label>Check-out</label>
        <input type="text" id="checkout">

        <label>Numero camere</label>
        <input type="text" id="camere">

        <label>Tipologia camera</label>
        <input type="text" id="tipologia">

        <label>Trattamento</label>
        <input type="text" id="trattamento">

        <label>Tariffa Standard</label>
        <input type="text" id="standard">

        <label>Tariffa Superior</label>
        <input type="text" id="superior">

    </div>
    <script src="script.js"></script>
</body>
</html>
